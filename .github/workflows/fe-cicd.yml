name: Frontend CI/CD

on:
    push:
        branches:
            - main
            - dev
            - format-and-deploy

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        steps:
            # 1. Checkout code
            - name: Checkout code
              uses: actions/checkout@v4

            # 2. Setup Node + pnpm
            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            # 3. Install deps + build frontend
            - name: Install dependencies
              run: pnpm install

            - name: Build frontend
              run: pnpm run build

            # 4. Build Docker image
            - name: Build Docker image
              run: |
                docker build --no-cache \ 
                  --build-arg VITE_PUBLIC_API_URL=${{ secrets.VITE_PUBLIC_API_URL }} \
                  -t ${{ secrets.DOCKER_USERNAME }}/frontend-app:latest .

            # 5. Login Docker Hub
            - name: Login to Docker Hub
              uses: docker/login-action@v2
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            # 6. Push image
            - name: Push Docker image
              run: docker push ${{ secrets.DOCKER_USERNAME }}/frontend-app:latest

            # 7. Copy docker-compose.yml to EC2
            - name: Copy docker-compose.yml to EC2
              uses: appleboy/scp-action@v0.1.7
              with:
                  host: ${{ secrets.EC2_HOST }}
                  username: ${{ secrets.EC2_USER }}
                  key: ${{ secrets.EC2_SSH_KEY }}
                  source: 'docker-compose.yml'
                  target: ~/frontend-app

    deploy:
        runs-on: ubuntu-latest
        needs: build-and-push
        steps:
            - name: Deploy on EC2 via SSH
              uses: appleboy/ssh-action@v0.1.10
              with:
                  host: ${{ secrets.EC2_HOST }}
                  username: ${{ secrets.EC2_USER }}
                  key: ${{ secrets.EC2_SSH_KEY }}
                  script: |
                      # Tạo thư mục lưu dữ liệu customer
                      mkdir -p ~/frontend-app/customer_data
                      # Pull image mới từ Docker Hub và deploy
                      cd ~/frontend-app
                      echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
                      docker-compose pull
                      docker-compose down
                      docker-compose up -d
                      echo "Deployed at $(date)" >> ~/frontend-app/deployed.log

                      