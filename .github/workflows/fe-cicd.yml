name: Frontend CI/CD

on:
  push:
    branches:
      - main
      - dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node + pnpm
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # 3. Install deps + build frontend
      - name: Install dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm run build

      # 4. Build Docker image
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/frontend-app:latest .

      # 5. Login Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # 6. Push image
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/frontend-app:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      # SSH vào EC2 và deploy
      - name: Pull & restart container on EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/frontend-app:latest
            docker stop frontend || true
            docker rm frontend || true
            docker run -d --name frontend -p 80:3000 ${{ secrets.DOCKERHUB_USERNAME }}/frontend-app:latest
            echo "Deployed at $(date)" >> ~/frontend-app/deployed.log
