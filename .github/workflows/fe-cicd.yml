name: Frontend CI/CD

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Log in Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Build Docker image
      - name: Build Docker image
        run: |
          docker build -t myfrontend:latest .

      # 4. Tag and push to Docker Hub
      - name: Push Docker image
        run: |
          docker tag myfrontend:latest <dockerhub_user>/myfrontend:latest
          docker push <dockerhub_user>/myfrontend:latest

      # 5. SSH to EC2 and pull image + restart container
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/frontend-app
            docker compose down
            docker compose pull
            docker compose up -d
            echo "Deployed at $(date)" > deployed.log
