services:
    frontend-app:
        image: ${DOCKER_IMAGE_SON}:${DOCKER_TAG}
        container_name: ${DOCKER_CONTAINER}
        env_file:
            - .env
        environment:
            NODE_ENV: production
        networks:
            - sope-ecommerce-frontend-app-network
        ports:
            - '3000:3000'
        restart: unless-stopped

networks:
    sope-ecommerce-frontend-app-network:
        external: true
